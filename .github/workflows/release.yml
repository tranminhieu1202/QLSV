name: Release Windows & macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Lấy số phiên bản từ tag
        id: ver
        shell: pwsh
        run: echo "version=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Cài Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Đóng gói installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'Không tìm thấy ISCC.exe' }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\qlgd_edu.iss

      - name: Phát hành GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --release

      # Bản chưa ký/notarize: lần đầu mở bằng chuột phải → Open.
      - name: Đóng gói .zip
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/QLGD EDU.app" "dist/qlgd_edu-${GITHUB_REF_NAME#v}-macos.zip"

      - name: Đính kèm vào GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-macos.zip

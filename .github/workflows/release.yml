name: Release Windows & macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Ghim phiên bản trùng máy dev: bản stable mới có thể thêm lint làm
          # `flutter analyze` trên CI fail dù máy dev vẫn sạch.
          flutter-version: 3.44.5
          cache: true

      - name: Lấy số phiên bản từ tag
        id: ver
        shell: pwsh
        run: echo "version=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Lấy phiên bản từ tag để app luôn báo đúng phiên bản, kể cả khi quên
      # sửa pubspec.yaml (nếu không, app sẽ báo cập nhật mãi không dứt).
      - run: flutter build windows --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      # Máy chưa cài Microsoft Visual C++ Redistributable báo thiếu
      # VCRUNTIME140_1.dll. Bộ cài không cần quyền admin nên không cài được
      # vc_redist: chép các DLL runtime cạnh qlgd_edu.exe (app-local
      # deployment, được Microsoft cho phép) để Inno Setup đóng gói kèm.
      - name: Kèm thư viện Visual C++ runtime
        shell: pwsh
        run: |
          $dest = 'build\windows\x64\runner\Release'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Không tìm thấy thư mục Microsoft.VC*.CRT' }
          Copy-Item "$($crt.FullName)\*.dll" $dest -ErrorAction Stop
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path "$dest\$dll")) { throw "Thiếu $dll sau khi chép" }
          }
          Get-ChildItem $dest -Filter *.dll | Select-Object Name, Length

      - name: Cài Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Đóng gói installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'Không tìm thấy ISCC.exe' }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\qlgd_edu.iss

      - name: Phát hành GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  # Bản macOS không build ở đây: cần ký Developer ID + notarize bằng tài khoản
  # Apple của team, nên chạy tools/release_devid.sh trên máy Mac rồi đính kèm
  # qlgd_edu-<phiên bản>-macos.zip vào release này. Bản chưa ký do CI build
  # trước đây bị Gatekeeper chặn, và nếu để CI chạy nó sẽ ghi đè bản đã notarize.
